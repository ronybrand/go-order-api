version: "2"
linters:
  default: standard
  enable:
    - gosec
    - errorlint
    - bodyclose
    - misspell
    - unconvert
    - nilerr
    - noctx
    - sloglint
  settings:
    sloglint:
      no-mixed-args: true
      context: all
  exclusions:
    rules:
      # Tests build requests and log without a request context on purpose.
      - path: _test\.go
        linters: [noctx, sloglint]
formatters:
  enable:
    - gofmt
    - goimports
