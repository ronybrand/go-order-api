version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Wait 3 days before proposing a brand-new release: a compromised package is usually caught
    # within hours, and security updates are not delayed by this.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      weekly-batch:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait 3 days before proposing a brand-new release: a compromised package is usually caught
    # within hours, and security updates are not delayed by this.
    cooldown:
      default-days: 3
    groups:
      weekly-batch:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Wait 3 days before proposing a brand-new release: a compromised package is usually caught
    # within hours, and security updates are not delayed by this.
    cooldown:
      default-days: 3
