name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request makes the older run pointless; a run on main is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The checks that need no infrastructure are their own jobs: they start immediately instead of
  # waiting for the Postgres/RabbitMQ containers to become healthy, and they run in parallel with
  # the test suite.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: go.mod }
      - run: gofmt -l . | (! grep .)
      # golangci-lint already runs gofmt and govet (.golangci.yml), so a separate `go vet ./...`
      # only duplicated work.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with: { version: latest }

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: go.mod }
      # setup-go caches GOMODCACHE/GOCACHE, so the compilation of govulncheck is reused between
      # runs. The version stays pinned instead of pulling whatever @latest resolves to.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0 && govulncheck ./...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: orders, POSTGRES_PASSWORD: orders, POSTGRES_DB: orders }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orders" --health-interval 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-retries 10
    env:
      TEST_BROKER_URL: amqp://guest:guest@127.0.0.1:5672/
      TEST_DATABASE_URL: postgres://orders:orders@127.0.0.1:5432/orders?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: go.mod }
      # -p 1: internal/postgres and internal/httpapi are integration suites that share the same
      # database and TRUNCATE it in their setup, so their test binaries must not run in parallel.
      - run: go test -p 1 -race -count=1 -coverprofile=coverage.out ./internal/...
      - run: sh scripts/check-coverage.sh coverage.out 80

  # The Dockerfile is what ships, and nothing else built it: a break (a base image tag, the Go
  # version, a moved cmd/ directory) would only show up when someone deployed. Builds both
  # binaries without pushing, then scans the result.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          build-args: TARGET=${{ matrix.target }}
          load: true
          push: false
          tags: go-order-api-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      # HIGH/CRITICAL findings with a fix available fail the build; unfixed ones are only noise
      # nobody can act on yet. Covers the distroless base and the Go standard library baked
      # into the binary.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: go-order-api-${{ matrix.target }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # Branch protection requires a check named "verify"; now that the work is split across jobs,
  # this is the single gate that goes red when any of them does.
  verify:
    if: always()
    needs: [lint, vuln, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
