name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: orders, POSTGRES_PASSWORD: orders, POSTGRES_DB: orders }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orders" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://orders:orders@127.0.0.1:5432/orders?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: gofmt -l . | (! grep .)
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with: { version: v2.1 }
      - run: go test -race -cover -count=1 ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
